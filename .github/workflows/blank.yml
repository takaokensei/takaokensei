name: Update lines-of-code stats

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday, 06:00 UTC
  workflow_dispatch:       # manual run from the Actions tab

permissions:
  contents: write

jobs:
  loc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cloc
        run: sudo apt-get update && sudo apt-get install -y cloc

      - name: Count lines of code and update README
        env:
          GH_USER: ${{ github.repository_owner }}
          # Public repos only works with the default token.
          # For private repos, create a PAT (repo read) and save it as secret LOC_TOKEN.
          GH_TOKEN: ${{ secrets.LOC_TOKEN || secrets.GITHUB_TOKEN }}
          INCLUDE_PRIVATE: ${{ secrets.LOC_TOKEN != '' && 'true' || 'false' }}
          EXCLUDE_REPOS: ""
          TOP_N: "8"
        run: python scripts/update_loc.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update lines-of-code stats [skip ci]"
          git push
